<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Samsung TV Remote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Верхняя панель -->
<header class="header">
    <button class="add-btn" id="addDeviceBtn">+</button>
    <div class="device-indicator" id="deviceName">Нет устройств</div>
</header>

<!-- Пульт -->
<div class="remote-wrapper">
    <svg viewBox="0 0 260 620" class="remote-svg" xmlns="http://www.w3.org/2000/svg">
        <!-- Корпус -->
        <rect x="5" y="5" width="250" height="610" rx="28" fill="#1e1e1e" stroke="#333" stroke-width="2"/>

        <!-- POWER -->
        <g class="btn" data-key="KEY_POWER">
            <circle cx="45" cy="45" r="20" fill="#d32f2f"/>
            <path d="M45 36 v10 M40 40 a8 8 0 1 0 10 0" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>

        <!-- SOURCE -->
        <g class="btn" data-key="KEY_SOURCE">
            <rect x="180" y="28" width="55" height="35" rx="8" fill="#333"/>
            <text x="207" y="50" fill="#fff" font-size="10" text-anchor="middle">SOURCE</text>
        </g>

        <!-- Громкость -->
        <g class="btn" data-key="KEY_VOLUP">
            <rect x="30" y="90" width="55" height="45" rx="10" fill="#2a2a2a" stroke="#444"/>
            <text x="57" y="120" fill="#fff" font-size="22" text-anchor="middle">+</text>
        </g>
        <g class="btn" data-key="KEY_VOLDOWN">
            <rect x="30" y="145" width="55" height="45" rx="10" fill="#2a2a2a" stroke="#444"/>
            <text x="57" y="175" fill="#fff" font-size="22" text-anchor="middle">-</text>
        </g>
        <text x="57" y="205" fill="#666" font-size="9" text-anchor="middle">VOL</text>

        <!-- MUTE -->
        <g class="btn" data-key="KEY_MUTE">
            <rect x="100" y="90" width="60" height="45" rx="10" fill="#2a2a2a" stroke="#444"/>
            <text x="130" y="117" fill="#fff" font-size="12" text-anchor="middle">MUTE</text>
        </g>

        <!-- Каналы -->
        <g class="btn" data-key="KEY_CHUP">
            <rect x="175" y="90" width="55" height="45" rx="10" fill="#2a2a2a" stroke="#444"/>
            <text x="202" y="120" fill="#fff" font-size="18" text-anchor="middle">∧</text>
        </g>
        <g class="btn" data-key="KEY_CHDOWN">
            <rect x="175" y="145" width="55" height="45" rx="10" fill="#2a2a2a" stroke="#444"/>
            <text x="202" y="175" fill="#fff" font-size="18" text-anchor="middle">∨</text>
        </g>
        <text x="202" y="205" fill="#666" font-size="9" text-anchor="middle">CH</text>

        <!-- HOME / BACK -->
        <g class="btn" data-key="KEY_HOME">
            <rect x="30" y="230" width="90" height="35" rx="8" fill="#333"/>
            <text x="75" y="252" fill="#fff" font-size="11" text-anchor="middle">HOME</text>
        </g>
        <g class="btn" data-key="KEY_RETURN">
            <rect x="140" y="230" width="90" height="35" rx="8" fill="#333"/>
            <text x="185" y="252" fill="#fff" font-size="11" text-anchor="middle">BACK</text>
        </g>

        <!-- D-Pad -->
        <g class="btn" data-key="KEY_UP">
            <rect x="105" y="290" width="50" height="40" rx="10" fill="#333" stroke="#555"/>
            <path d="M130 302 l-7 12 h14 z" fill="#fff"/>
        </g>
        <g class="btn" data-key="KEY_DOWN">
            <rect x="105" y="405" width="50" height="40" rx="10" fill="#333" stroke="#555"/>
            <path d="M130 433 l-7 -12 h14 z" fill="#fff"/>
        </g>
        <g class="btn" data-key="KEY_LEFT">
            <rect x="50" y="347" width="50" height="40" rx="10" fill="#333" stroke="#555"/>
            <path d="M72 367 l12 -7 v14 z" fill="#fff"/>
        </g>
        <g class="btn" data-key="KEY_RIGHT">
            <rect x="160" y="347" width="50" height="40" rx="10" fill="#333" stroke="#555"/>
            <path d="M188 367 l-12 -7 v14 z" fill="#fff"/>
        </g>
        <g class="btn" data-key="KEY_ENTER">
            <circle cx="130" cy="367" r="30" fill="#1a1a1a" stroke="#666" stroke-width="2"/>
            <text x="130" y="372" fill="#fff" font-size="11" text-anchor="middle">OK</text>
        </g>

        <!-- MENU -->
        <g class="btn" data-key="KEY_MENU">
            <rect x="30" y="470" width="90" height="35" rx="8" fill="#333"/>
            <text x="75" y="492" fill="#fff" font-size="11" text-anchor="middle">MENU</text>
        </g>
        <g class="btn" data-key="KEY_GUIDE">
            <rect x="140" y="470" width="90" height="35" rx="8" fill="#333"/>
            <text x="185" y="492" fill="#fff" font-size="11" text-anchor="middle">GUIDE</text>
        </g>

        <!-- Воспроизведение -->
        <g class="btn" data-key="KEY_REWIND">
            <rect x="30" y="520" width="55" height="35" rx="8" fill="#2a2a2a" stroke="#444"/>
            <text x="57" y="543" fill="#fff" font-size="14" text-anchor="middle">◀◀</text>
        </g>
        <g class="btn" data-key="KEY_PLAY">
            <rect x="102" y="520" width="55" height="35" rx="8" fill="#2a2a2a" stroke="#444"/>
            <text x="129" y="543" fill="#fff" font-size="14" text-anchor="middle">▶</text>
        </g>
        <g class="btn" data-key="KEY_PAUSE">
            <rect x="174" y="520" width="55" height="35" rx="8" fill="#2a2a2a" stroke="#444"/>
            <text x="201" y="543" fill="#fff" font-size="14" text-anchor="middle">⏸</text>
        </g>

        <!-- Логотип -->
        <text x="130" y="590" fill="#555" font-size="11" font-family="sans-serif" text-anchor="middle" letter-spacing="3">SAMSUNG</text>
    </svg>
</div>

<!-- Модальное окно добавления устройства -->
<div class="modal" id="deviceModal">
    <div class="modal-content">
        <h2>Добавить устройство</h2>
        
        <button id="discoverBtn" class="discover-btn">🔍 Найти телевизоры в сети</button>
        <div id="discoverStatus" class="discover-status"></div>
        <div id="foundDevices" class="found-list"></div>
        
        <div class="divider">или введи вручную</div>
        
        <input type="text" id="ipInput" placeholder="IP-адрес (192.168.1.50)">
        <input type="text" id="nameInput" placeholder="Название (Телевизор в гостиной)">
        <button id="saveDeviceBtn">Сохранить устройство</button>
        <button id="cancelBtn" class="cancel">Отмена</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
