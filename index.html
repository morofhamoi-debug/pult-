<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TV Remote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="remote-container">
        <h2>Пульт ТВ</h2>
        
        <!-- Поле для ввода IP-адреса телевизора -->
        <div class="settings">
            <input type="text" id="tv-ip" placeholder="IP телевизора (например, 192.168.1.50)">
            <button onclick="saveIp()" class="save-btn">Сохранить IP</button>
        </div>

        <!-- Кнопки пульта -->
        <div class="remote">
            <button class="power" onclick="sendKey('power')">POWER</button>
            
            <button onclick="sendKey('vol_up')">VOL +</button>
            <button onclick="sendKey('mute')">MUTE</button>
            <button onclick="sendKey('ch_up')">CH +</button>
            
            <button onclick="sendKey('vol_down')">VOL -</button>
            <button onclick="sendKey('home')">HOME</button>
            <button onclick="sendKey('ch_down')">CH -</button>
            
            <button onclick="sendKey('left')">◀</button>
            <button onclick="sendKey('ok')">OK</button>
            <button onclick="sendKey('right')">▶</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
