<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Samsung TV Remote</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="remote">
    <!-- Верхняя панель -->
    <div class="top-bar">
        <button class="btn power-btn" data-key="KEY_POWER">⏻</button>
        <span class="status" id="status">Офлайн</span>
        <button class="btn source-btn" data-key="KEY_SOURCE">SOURCE</button>
    </div>

    <!-- Цифровая панель -->
    <div class="numpad">
        <button class="btn num" data-key="KEY_1">1</button>
        <button class="btn num" data-key="KEY_2">2</button>
        <button class="btn num" data-key="KEY_3">3</button>
        <button class="btn num" data-key="KEY_4">4</button>
        <button class="btn num" data-key="KEY_5">5</button>
        <button class="btn num" data-key="KEY_6">6</button>
        <button class="btn num" data-key="KEY_7">7</button>
        <button class="btn num" data-key="KEY_8">8</button>
        <button class="btn num" data-key="KEY_9">9</button>
        <button class="btn num" data-key="KEY_TTX_MIX">TTX/MIX</button>
        <button class="btn num" data-key="KEY_0">0</button>
        <button class="btn num" data-key="KEY_PRECH">PRE-CH</button>
    </div>

    <!-- Громкость и Каналы -->
    <div class="row-controls">
        <div class="col">
            <button class="btn rocker" data-key="KEY_VOLUP">+</button>
            <button class="btn rocker" data-key="KEY_VOLDOWN">-</button>
        </div>
        <div class="col">
            <button class="btn wide" data-key="KEY_MUTE">MUTE</button>
            <button class="btn wide" data-key="KEY_CH_LIST">CH LIST</button>
        </div>
        <div class="col">
            <button class="btn rocker" data-key="KEY_CHUP">P ^</button>
            <button class="btn rocker" data-key="KEY_CHDOWN">P v</button>
        </div>
    </div>

    <!-- Меню и Навигация -->
    <div class="menu-row">
        <button class="btn menu-btn" data-key="KEY_MENU">MENU</button>
        <button class="btn menu-btn" data-key="KEY_SMART_HUB">SMART HUB</button>
        <button class="btn menu-btn" data-key="KEY_GUIDE">GUIDE</button>
    </div>

    <div class="dpad-container">
        <button class="btn dpad up" data-key="KEY_UP">▲</button>
        <button class="btn dpad left" data-key="KEY_LEFT">◀</button>
        <button class="btn dpad enter" data-key="KEY_ENTER">ENTER</button>
        <button class="btn dpad right" data-key="KEY_RIGHT">▶</button>
        <button class="btn dpad down" data-key="KEY_DOWN">▼</button>
    </div>

    <div class="menu-row">
        <button class="btn menu-btn" data-key="KEY_TOOLS">TOOLS</button>
        <button class="btn menu-btn" data-key="KEY_INFO">INFO</button>
        <button class="btn menu-btn" data-key="KEY_RETURN">RETURN</button>
        <button class="btn menu-btn" data-key="KEY_EXIT">EXIT</button>
    </div>

    <!-- Цветные кнопки -->
    <div class="color-row">
        <button class="btn color red" data-key="KEY_RED">A</button>
        <button class="btn color green" data-key="KEY_GREEN">B</button>
        <button class="btn color yellow" data-key="KEY_YELLOW">C</button>
        <button class="btn color blue" data-key="KEY_BLUE">D</button>
    </div>

    <!-- Медиа -->
    <div class="media-row">
        <button class="btn" data-key="KEY_REWIND">◀◀</button>
        <button class="btn" data-key="KEY_PLAY">▶</button>
        <button class="btn" data-key="KEY_PAUSE">⏸</button>
        <button class="btn" data-key="KEY_FF">▶▶</button>
    </div>

    <div class="brand">SAMSUNG</div>
</div>

<script src="script.js"></script>
</body>
</html>
